<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>参謀ゲスト</title>
<style>
body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#0d1210;color:#d7e5d9;max-width:640px;margin:0 auto;padding:24px 16px;line-height:1.7}
h1{font-size:22px;color:#9fe0a8;margin:0 0 4px}
.box{background:#18201c;border:1px solid #2f3a33;border-radius:12px;padding:14px;margin:16px 0}
code{display:block;background:#060b10;color:#a9cde6;padding:12px;border-radius:8px;font-size:14px;word-break:break-all}
button{background:#9fe0a8;color:#0d1210;border:0;border-radius:18px;padding:10px 22px;font-size:16px;font-weight:600;margin-top:10px;cursor:pointer}
ol{padding-left:20px} .ok{color:#9fe0a8;margin-left:8px} small{color:#7d9282}
</style></head><body>
<h1>▮ 参謀ゲスト（Mac）</h1>
<small>この Mac で、Claude Code をその回だけ使い捨てで動かします。何も入れず、スマホを抜くと消えます。</small>
<div class="box">
<ol>
<li>下の「コピー」を押す</li>
<li>ターミナルを開く（⌘＋スペース →「ターミナル」）</li>
<li>⌘V で貼り付けて Enter</li>
</ol>
<code id="cmd">zsh &lt;(curl -fsSL https://akihironoji.github.io/sanbo-guest/m)</code>
<button id="copy">コピー</button><span id="done" class="ok"></span>
</div>
<small>Windows は、スマホをファイル転送でつなぎ、スマホの「Download/Sanbo」の sanbo-guest-*.cmd を開いてください。</small>
<script>
document.getElementById('copy').onclick=async()=>{
  const t=document.getElementById('cmd').textContent;
  try{await navigator.clipboard.writeText(t);}catch(e){const r=document.createRange();r.selectNode(document.getElementById('cmd'));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy');}
  document.getElementById('done').textContent='コピーしました';
};
</script>
</body></html>
